name: Run Selenium Java Tests (Manual)

on:
  workflow_dispatch:

jobs:
  selenium-java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t selenium-java .

      - name: Run Selenium Tests in Docker
        run: docker run selenium-java

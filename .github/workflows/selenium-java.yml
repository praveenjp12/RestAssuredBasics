name: Run Selenium Java Tests (Manual)

on:
  workflow_dispatch:

jobs:
  selenium-java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t selenium-java .

      - name: Run Selenium Tests in Docker
        run: docker run selenium-java

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReportsData
          path: target/allure-results
  job2:
    name: reports
    if: always()
    runs-on: ubuntu-latest
    needs: selenium-java
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReportsData
          path: allure-results 
      - name: Get Allure history
        uses: actions/checkout@v2
        if: always()
        continue-on-error: true
        with:
            ref: gh-pages
            path: gh-pages
         
      - name: Allure Report action from marketplace
        uses: praveenjp12/cypress-project/allure-report-deploy@main
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 2
  
      - name: Deploy report to Github Pages
        if: always()
        uses: praveenjp12/cypress-project/allure-report-release@main
        env:
          PERSONAL_TOKEN: ${{ secrets.MY_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history
